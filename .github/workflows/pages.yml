name: Publish specimen to GitHub Pages

# Publishes specimen/ (the interactive, font-embedded specimen page) to
# GitHub Pages every time it changes on the default branch -- so there's
# always a live, shareable URL that reflects the current build, without
# anyone needing to download and open the file locally.
#
# One-time setup this workflow can't do for you: GitHub Pages has to be
# switched to "GitHub Actions" as its source at least once, in this
# repo's Settings -> Pages. After that, every run here keeps the site in
# sync automatically.
on:
  push:
    branches:
      - master
    paths:
      - "specimen/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload specimen as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: specimen

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
