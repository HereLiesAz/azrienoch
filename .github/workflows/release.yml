name: Publish release

# Builds the variable font from source and publishes it as a GitHub
# Release every time the default branch changes -- so there's always a
# downloadable, versioned Azrienoch-VF.ttf (plus a WOFF2 of the same
# font, for @font-face use) that doesn't require cloning the repo or
# running the Python build pipeline. `tools/validate_build` (run as
# part of `designspace_build.py`) gates this: a build that fails
# validation fails the workflow before anything is published.
#
# The release is tagged with a real semantic version, computed by
# `tools/next_version.py` -- see that module's docstring for exactly how
# (automatic MAJOR/MINOR/PATCH bump from conventional-commit messages
# since the last release, with a manual override via the VERSION file
# that always wins). The same version is embedded in the built font
# itself (AZRIENOCH_VERSION, read by ufo_build.py), so a release's tag
# and its binary's own version always agree.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # next_version.py needs full tag/commit history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Determine release version
        id: release_info
        run: |
          version="$(python3 tools/next_version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and validate the font
        env:
          AZRIENOCH_VERSION: ${{ steps.release_info.outputs.version }}
        run: PYTHONPATH=. python3 tools/designspace_build.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_info.outputs.version }}
          name: Azrienoch v${{ steps.release_info.outputs.version }} (${{ steps.release_info.outputs.sha }})
          generate_release_notes: true
          files: |
            fonts/variable/Azrienoch-VF.ttf
            fonts/variable/Azrienoch-VF.woff2
