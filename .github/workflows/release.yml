name: Publish release

# Builds the variable font from source and publishes it as a GitHub
# Release every time the default branch changes -- so there's always a
# downloadable, versioned Azrienoch-VF.ttf that doesn't require cloning
# the repo or running the Python build pipeline. `tools/validate_build`
# (run as part of `designspace_build.py`) gates this: a build that fails
# validation fails the workflow before anything is published.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build and validate the font
        run: PYTHONPATH=. python3 tools/designspace_build.py

      - name: Determine release tag
        id: release_info
        run: |
          echo "tag=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Azrienoch ${{ steps.release_info.outputs.tag }} (${{ steps.release_info.outputs.sha }})
          generate_release_notes: true
          files: fonts/variable/Azrienoch-VF.ttf
